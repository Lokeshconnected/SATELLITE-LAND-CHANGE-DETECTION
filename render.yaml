services:
  - type: web
    name: satellite-land-change-detection
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: EARTH_ENGINE_PROJECT
        value: satellite-change-ai
      - key: EARTH_ENGINE_SERVICE_ACCOUNT_JSON
        sync: false

services:
  - type: web
    name: satellite-land-change-detection
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: EARTH_ENGINE_PROJECT
        sync: false
      - key: EARTH_ENGINE_SERVICE_ACCOUNT_JSON
        sync: false
